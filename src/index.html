<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Credit card statements (PDF) read in the browser with no AI: Chase, Capital One, Citi, Bank of America, American Express and Apple Card. Balance check, what to pay by when, calendar reminders. Nothing leaves the browser." />
  <title>Credit Cards Reports</title>
  <link rel="icon" type="image/x-icon" href="./favicon.ico">

  <!-- Inter font  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="./index.css" type="text/css" rel="stylesheet" />

  <!-- Synchronous theme init (prevents flash, same strategy as Stocks and fidelity-reports) -->
  <script>
    (function () {
      var dark = false;
      try { dark = localStorage.getItem('credit-cards-reports-theme') === 'dark'; } catch (e) {}
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.backgroundColor = dark ? '#020617' : '#f8fafc';
    })();
  </script>

</head>
<body class="min-h-screen font-sans bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">
  <div id="root"></div>
  <script src="./main.tsx" type="module"></script>
</body>
</html>
